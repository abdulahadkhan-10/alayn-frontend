name: Deploy Frontend

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/alayn-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "==> Navigating to root project directory..."
            cd /opt/apps/projects/ALAYN

            echo "==> Pulling latest frontend image..."
            docker compose pull alayn-frontend

            echo "==> Force-recreating frontend container..."
            docker compose up -d --force-recreate --remove-orphans alayn-frontend

            echo "==> Verifying container health status..."
            MAX_RETRIES=15
            COUNT=0
            until [ $COUNT -ge $MAX_RETRIES ]
            do
              STATUS=$(docker inspect --format='{{.State.Status}}' alayn-frontend 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "running" ]; then
                HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}' alayn-frontend 2>/dev/null || echo "healthy")
                if [ "$HEALTH" = "healthy" ]; then
                  echo "==> Container alayn-frontend is running and healthy!"
                  break
                fi
              fi
              echo "Waiting for container to be ready... (attempt $((COUNT+1))/$MAX_RETRIES)"
              COUNT=$((COUNT+1))
              sleep 3
            done

            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "Error: Container alayn-frontend failed to reach healthy state!"
              docker logs --tail 50 alayn-frontend
              exit 1
            fi

            echo "==> Cleaning up unused Docker images..."
            docker image prune -af
